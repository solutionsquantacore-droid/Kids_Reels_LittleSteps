name: Update Kids Reels Daily

on:
  schedule:
    # ⏰ Runs automatically once every 24 hours at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual button trigger from GitHub UI

jobs:
  update-reels:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Fetch Script
        run: |
          python fetch_reels.py kids_reels.json

      - name: Commit and Push Updated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add kids_reels.json
          if git diff --staged --quiet; then
            echo "No changes found. kids_reels.json is already up to date."
          else
            git commit -m "Auto-update kids reels $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
          fi
